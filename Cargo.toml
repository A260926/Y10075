[package]
name = "webhook-replay"
version = "0.1.0"
edition = "2021"

[lib]
name = "webhook_replay"
path = "src/lib.rs"

[[bin]]
name = "webhook-replay"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
rand = "0.8"
hex = "0.4"
anyhow = "1.0.104"
